<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
        <title>Resume Builder</title>
    </head>
    <body>
        <div class = "container">
            <div class = "row">
                <div class = "col-md-7">
                    <form method = "POST">
                        {% csrf_token %}
                        <h1 class="mb-4">Resume Builder</h1>
                        <div class="form-group">
                          <label for="">Name</label>
                          <input type="text" class="form-control" id="name" name = "name" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label for="">Email</label>
                            <input type="text" class="form-control" id="email" name = "email" placeholder="Enter your Email" required>
                        </div>
                        <div class="form-group">
                            <label for="">Phone</label>
                            <input type="text" class="form-control" id="phone" name = "phone" placeholder="Enter your Phone" required>
                        </div>
                        <div class="form-group">
                            <label for="">Address</label>
                            <textarea type="text" class="form-control" id="address" name = "address" placeholder="Enter your Address" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="">Summary</label>
                            <textarea type="text" class="form-control" id="summary" name = "summary" placeholder="Enter About you" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="">Degree</label>
                            <input type="text" class="form-control" id="degree" name = "degree" placeholder="Enter your Degree" required>
                        </div>
                        <div class="form-group">
                            <label for="">University</label>
                            <input type="text" class="form-control" id="university" name = "university" placeholder="Enter your University" required>
                        </div>
                        <div class="form-group">
                            <label for="">Experience</label>
                            <textarea type="text" class="form-control" id="previous_experience" name = "previous_experience" placeholder="Enter your Experience"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="">Skills</label>
                            <textarea type="text" class="form-control" id="skills" name = "skills" placeholder="Enter your Skills" required></textarea>
                        </div>
                      <button type="submit" class="btn btn-primary">Submit</button>
                      </form>
                      <div class="mt-4">
                        <a href="{% url 'view_resume_html' 1 %}" class="btn btn-info mr-2" target="_blank">Example Resume template</a>
                        <a href="{% url 'list' %}" class="btn btn-secondary">Open Resume List</a>
                      </div>
                </div>
            </div>
        </div>    
    </body>
</html>
