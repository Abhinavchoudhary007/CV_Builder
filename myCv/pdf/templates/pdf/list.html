<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Profile List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          integrity="sha512-n1KcQ3zRWtBKM0+YtO8mrAaqbctWk3hQoWlL6Z6GQFvLcv0c9ulv0vW9FYl0GyKJQMBs4b5x9+1XdFoFEO/7WQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .profile-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }

        .profile-card:hover {
            transform: scale(1.02);
        }

        .download-btn {
            text-decoration: none;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="text-center mb-5">
        <h2 class="display-4 font-weight-bold">CV Profile List</h2>
        <p class="text-muted">Browse and download CVs</p>
    </div>

    {% for profile in profiles %}
    <div class="card mb-4 profile-card">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0"><i class="fas fa-user-circle mr-2"></i> {{ profile.name }}</h5>
            </div>
            <div>
                <a href="{% url 'resume' profile.id %}" class="btn btn-primary">
                    <i class="fas fa-download mr-1"></i> Download
                </a>
                <a href="{% url 'view_resume_html' profile.id %}" class="btn btn-info ml-2" target="_blank">
                    <i class="fas fa-eye"></i> View
                </a>
                <form method="post" action="{% url 'delete_profile' profile.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger ml-2" onclick="return confirm('Are you sure you want to delete this resume?');">
                        <i class="fas fa-trash-alt"></i> Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
</body>
</html>
